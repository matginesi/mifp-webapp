name: CI/CD

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Default workflow token is read-only. Only the GHCR publish job opts into
# packages:write.
permissions:
  contents: read

jobs:
  hygiene:
    name: Reject runtime/generated repository data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Check tracked source hygiene
        run: python tools/check_repo_hygiene.py

  test:
    name: Test runtime + data pipeline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install tested dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r MIFPAPP/CORE/requirements.lock
          python -m pip install -r SCRAPERS/requirements.txt -r MIFPAPP/DATABASE/requirements.txt pytest
      - name: Run non-browser repository tests
        env:
          MIFP_TEST_AUTO_INSTALL: "0"
        run: bash test_all.sh --suite quick

  audit:
    name: Audit Python dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install pinned audit tool
        run: python -m pip install --disable-pip-version-check "pip-audit==2.10.1"
      - name: Audit runtime dependencies
        run: python -m pip_audit -r MIFPAPP/CORE/requirements.lock
      - name: Audit scraper dependencies
        run: python -m pip_audit -r SCRAPERS/requirements.txt
      - name: Audit database pipeline dependencies
        run: python -m pip_audit -r MIFPAPP/DATABASE/requirements.txt

  build-pr:
    name: Build Docker image (pull requests only)
    needs: [hygiene, test, audit]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build without publishing
        uses: docker/build-push-action@v7
        with:
          context: MIFPAPP/CORE
          push: false
          cache-from: type=gha,scope=mifp
          cache-to: type=gha,mode=max,scope=mifp

  build:
    name: Build and publish GHCR image
    needs: [hygiene, test, audit]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build-image.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        id: build-image
        uses: docker/build-push-action@v7
        with:
          context: MIFPAPP/CORE
          push: true
          tags: ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=mifp
          cache-to: type=gha,mode=max,scope=mifp

  verify-image:
    name: Verify published production image
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull immutable image
        env:
          IMAGE: ghcr.io/${{ github.repository }}@${{ needs.build.outputs.digest }}
        run: docker pull "$IMAGE"
      - name: Provision schema-only test database
        env:
          IMAGE: ghcr.io/${{ github.repository }}@${{ needs.build.outputs.digest }}
        run: |
          docker volume create mifp-image-verify-data
          docker run --rm --network none --entrypoint python \
            --volume mifp-image-verify-data:/app/data \
            "$IMAGE" -m mifp_app.db.manage init /app/data/mifp.db
      - name: Start image and verify health endpoints
        env:
          IMAGE: ghcr.io/${{ github.repository }}@${{ needs.build.outputs.digest }}
        run: |
          docker run --detach --name mifp-image-verify \
            --read-only \
            --tmpfs /tmp:size=64m,mode=1777,noexec,nosuid,nodev \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --pids-limit 256 \
            --publish 127.0.0.1::8000 \
            --volume mifp-image-verify-data:/app/data \
            --env MIFP_LOAD_DOTENV=0 \
            --env FLASK_ENV=production \
            --env FLASK_DEBUG=0 \
            --env SECRET_KEY=ci-image-verification-secret-key-00000000000000000000000000000000 \
            --env ADMIN_USERNAME=ci-admin \
            --env ADMIN_PASSWORD_HASH=ci-verification-placeholder \
            --env TRUSTED_HOSTS=127.0.0.1,localhost \
            --env DATABASE_PATH=/app/data/mifp.db \
            --env ASSETS_DIR=/app/data/assets \
            --env EXPORT_DIR=/app/data/exports \
            --env LOG_DIR=/app/data/logs \
            --env CONFERENCES_DIR=/app/data/conferences \
            --env BANNER_SETTINGS_PATH=/app/data/config/banner_settings.json \
            --env TMPDIR=/app/data/tmp \
            --env STORAGE_MIN_FREE_MB=0 \
            --env LOG_OUTPUT=stdout \
            --env GUNICORN_BIND=0.0.0.0:8000 \
            "$IMAGE"

          port="$(docker port mifp-image-verify 8000/tcp | sed -n 's/.*://p' | head -n 1)"
          test -n "$port"
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error --max-time 3 "http://127.0.0.1:${port}/ready" >/dev/null; then
              curl --fail --silent --show-error --max-time 3 "http://127.0.0.1:${port}/health" >/dev/null
              exit 0
            fi
            if test "$(docker inspect --format '{{.State.Running}}' mifp-image-verify)" != "true"; then
              docker logs mifp-image-verify
              exit 1
            fi
            sleep 2
          done
          docker logs mifp-image-verify
          exit 1
      - name: Clean up verification container
        if: always()
        run: |
          docker rm --force mifp-image-verify 2>/dev/null || true
          docker volume rm --force mifp-image-verify-data 2>/dev/null || true
