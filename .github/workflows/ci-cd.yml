name: CI/CD

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Default workflow token is read-only. The publish job opts into packages:write.
permissions:
  contents: read

jobs:
  test:
    name: Test runtime + data pipeline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tested dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r MIFPAPP/CORE/requirements.lock
          python -m pip install -r SCRAPERS/requirements.txt -r MIFPAPP/DATABASE/requirements.txt pytest
      - name: Audit Python dependencies
        run: |
          python -m pip install pip-audit
          python -m pip_audit -r MIFPAPP/CORE/requirements.lock
          python -m pip_audit -r SCRAPERS/requirements.txt
          python -m pip_audit -r MIFPAPP/DATABASE/requirements.txt
      - name: Run non-browser repository tests
        env:
          MIFP_TEST_AUTO_INSTALL: "0"
        run: bash test_all.sh --suite quick

  build-pr:
    name: Verify production Docker image
    needs: test
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build without publishing
        uses: docker/build-push-action@v6
        with:
          context: MIFPAPP/CORE
          push: false
          cache-from: type=gha,scope=mifp
          cache-to: type=gha,mode=max,scope=mifp

  build:
    name: Build and publish GHCR image
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: MIFPAPP/CORE
          push: true
          tags: ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=mifp
          cache-to: type=gha,mode=max,scope=mifp
