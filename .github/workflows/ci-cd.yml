name: CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # Keep stale runs bounded, but never let a manual verification cancel an
  # in-flight main-branch release (or vice versa).
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

# Default workflow token is read-only. Only the GHCR publish job opts into
# packages:write.
permissions:
  contents: read

env:
  # Bound network stalls in pip itself; shell steps below add hard wall-clock
  # limits as a second layer.
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_DEFAULT_TIMEOUT: "45"
  PIP_RETRIES: "4"

# Third-party actions are pinned to full commit SHAs (tag in the comment) so a
# moved tag or an upstream account takeover cannot run different code in a job
# that holds packages:write. Updates are reviewed explicitly instead of being
# opened automatically by a dependency bot.
jobs:
  hygiene:
    name: Reject runtime/generated repository data
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Check tracked source hygiene
        run: python tools/check_repo_hygiene.py
      - name: Check the production Compose exposure contract
        run: |
          # Docker publishes ports through its own iptables rules, so a UFW rule
          # would not contain a bad mapping: every published port must be
          # loopback-bound. The scan is scoped to the `ports:` key by
          # indentation, so `volumes:`, `tmpfs:` and other list keys can never be
          # mistaken for port mappings. Standard library only, because this job
          # does not install project dependencies.
          python3 - <<'PY'
          import re
          import sys
          from pathlib import Path

          LOOPBACK = re.compile(r"^(?:127\.0\.0\.1|\[::1\]):\d+:\d+$")
          target = Path(sys.argv[1]).resolve() if len(sys.argv) > 1 else Path("deploy/compose.production.yaml")


          def block_items(lines, start):
              """List items belonging to the mapping key on line `start`."""
              entries = []
              key_indent = len(lines[start]) - len(lines[start].lstrip())
              for line in lines[start + 1:]:
                  if not line.strip() or line.lstrip().startswith("#"):
                      continue
                  if len(line) - len(line.lstrip()) <= key_indent:
                      break
                  item = line.strip()
                  if item.startswith("- "):
                      entries.append(item[2:].strip())
              return entries


          lines = target.read_text(encoding="utf-8").splitlines()
          published = []
          for index, line in enumerate(lines):
              stripped = line.strip()
              if stripped == "ports:":
                  published.extend(block_items(lines, index))
              elif stripped.startswith("ports:") and "[" in stripped:
                  inline = stripped[len("ports:"):].strip()
                  if inline.startswith("[") and inline.endswith("]"):
                      published.extend(part.strip() for part in inline[1:-1].split(",") if part.strip())

          entries = [entry.strip().strip('"').strip("'") for entry in published]
          if not entries:
              print(
                  "No published port found in the production Compose file; Caddy could not reach "
                  "the webapp and this check refuses to pass silently.",
                  file=sys.stderr,
              )
              raise SystemExit(1)
          offenders = [entry for entry in entries if not LOOPBACK.fullmatch(entry)]
          if offenders:
              print("Non-loopback published port(s): " + ", ".join(offenders), file=sys.stderr)
              raise SystemExit(1)
          print(f"Compose exposure contract OK ({len(entries)} loopback port mapping(s)).")
          PY

  secrets:
    name: Scan tracked files and Git history for secrets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Install pinned gitleaks with checksum verification
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          # A missing/corrupt download fails this step, which is visibly distinct
          # from the scan step below reporting actual leaks.
          curl --fail --silent --show-error --location \
            --connect-timeout 10 --max-time 120 --retry 3 --retry-delay 2 --retry-all-errors \
            -o gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar xzf gitleaks.tgz gitleaks
      - name: Scan the full Git history
        run: timeout --foreground 4m ./gitleaks git . --no-banner --redact --config .gitleaks.toml
      - name: Scan the checked-out tree
        run: timeout --foreground 4m ./gitleaks dir . --no-banner --redact --config .gitleaks.toml

  test:
    name: Test ${{ matrix.suite }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        suite: [webapp, data]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            MIFPAPP/CORE/requirements.lock
            SCRAPERS/requirements.txt
            MIFPAPP/DATABASE/requirements.txt
            .github/requirements-test.txt
      - name: Install webapp test dependencies
        if: matrix.suite == 'webapp'
        run: |
          timeout --foreground 10m python -m pip install --prefer-binary \
            -r MIFPAPP/CORE/requirements.lock \
            -r .github/requirements-test.txt
      - name: Install data-pipeline test dependencies
        if: matrix.suite == 'data'
        run: |
          timeout --foreground 10m python -m pip install --prefer-binary \
            -r SCRAPERS/requirements.txt \
            -r MIFPAPP/DATABASE/requirements.txt \
            -r .github/requirements-test.txt
      - name: Run webapp tests in isolated workers
        if: matrix.suite == 'webapp'
        env:
          MIFP_TEST_AUTO_INSTALL: "0"
        run: |
          timeout --foreground 20m bash test_all.sh --suite webapp -- \
            -n 2 --dist=loadfile --durations=20
      - name: Run scraper, database and repository-tool tests
        if: matrix.suite == 'data'
        env:
          MIFP_TEST_AUTO_INSTALL: "0"
        run: |
          timeout --foreground 8m bash test_all.sh --suite scraper -- --durations=10
          timeout --foreground 8m bash test_all.sh --suite database -- --durations=10
          timeout --foreground 4m bash test_all.sh --suite tools -- --durations=10

  audit:
    name: Audit Python dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            MIFPAPP/CORE/requirements.lock
            SCRAPERS/requirements.txt
            MIFPAPP/DATABASE/requirements.txt
            .github/requirements-test.txt
      - name: Install pinned audit tool
        run: timeout --foreground 5m python -m pip install --disable-pip-version-check "pip-audit==2.10.1"
      - name: Audit runtime dependencies
        run: timeout --foreground 5m python -m pip_audit -r MIFPAPP/CORE/requirements.lock
      - name: Audit scraper dependencies
        run: timeout --foreground 5m python -m pip_audit -r SCRAPERS/requirements.txt
      - name: Audit database pipeline dependencies
        run: timeout --foreground 5m python -m pip_audit -r MIFPAPP/DATABASE/requirements.txt

  release:
    name: Build, verify, scan, and publish production image
    needs: [hygiene, test, audit, secrets]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    env:
      LOCAL_IMAGE: mifp-ci:sha-${{ github.sha }}
      SHA_IMAGE: ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
      LATEST_IMAGE: ghcr.io/${{ github.repository }}:latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build production image locally
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: MIFPAPP/CORE
          load: true
          push: false
          tags: ${{ env.LOCAL_IMAGE }}
          cache-from: type=gha,scope=mifp
          cache-to: type=gha,mode=max,scope=mifp

      - name: Provision schema-only test database
        run: |
          docker volume create mifp-image-verify-data
          timeout --foreground 2m docker run --rm --network none --entrypoint python \
            --volume mifp-image-verify-data:/app/data \
            "$LOCAL_IMAGE" -m mifp_app.db.manage init /app/data/mifp.db

      - name: Start local image and verify health endpoints
        run: |
          contract="$(docker image inspect "$LOCAL_IMAGE" --format '{{ index .Config.Labels "org.mifp.deploy-contract" }}')"
          case "$contract" in
            ''|*[!0-9]*)
              echo "Invalid or missing org.mifp.deploy-contract label: $contract" >&2
              exit 1
              ;;
          esac
          echo "Verifying local image with deploy contract v$contract"

          docker run --detach --name mifp-image-verify \
            --read-only \
            --tmpfs /tmp:size=64m,mode=1777,noexec,nosuid,nodev \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --pids-limit 256 \
            --publish 127.0.0.1:18080:8000 \
            --volume mifp-image-verify-data:/app/data \
            --env MIFP_DEPLOY_CONTRACT="$contract" \
            --env MIFP_LOAD_DOTENV=0 \
            --env FLASK_ENV=production \
            --env FLASK_DEBUG=0 \
            --env SECRET_KEY=ci-image-verification-secret-key-00000000000000000000000000000000 \
            --env ADMIN_USERNAME=ci-admin \
            --env ADMIN_PASSWORD_HASH=ci-verification-placeholder \
            --env TRUSTED_HOSTS=127.0.0.1,localhost \
            --env DATABASE_PATH=/app/data/mifp.db \
            --env ASSETS_DIR=/app/data/assets \
            --env EXPORT_DIR=/app/data/exports \
            --env LOG_DIR=/app/data/logs \
            --env CONFERENCES_DIR=/app/data/conferences \
            --env RUNTIME_CONFIG_DIR=/app/data/config \
            --env TMPDIR=/app/data/tmp \
            --env STORAGE_MIN_FREE_MB=0 \
            --env LOG_OUTPUT=stdout \
            --env GUNICORN_BIND=0.0.0.0:8000 \
            "$LOCAL_IMAGE"

          port=18080
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error --max-time 3 "http://127.0.0.1:${port}/ready" >/dev/null; then
              curl --fail --silent --show-error --max-time 3 "http://127.0.0.1:${port}/health" >/dev/null
              exit 0
            fi
            if test "$(docker inspect --format '{{.State.Running}}' mifp-image-verify)" != "true"; then
              docker logs mifp-image-verify
              exit 1
            fi
            sleep 2
          done
          docker logs mifp-image-verify
          exit 1

      - name: Clean up verification container
        if: always()
        run: |
          docker rm --force mifp-image-verify 2>/dev/null || true
          docker volume rm --force mifp-image-verify-data 2>/dev/null || true

      - name: Install pinned Trivy with checksum verification
        env:
          TRIVY_VERSION: "0.74.0"
          TRIVY_SHA256: "2ae6fe3ee734b7fdf11335663e18c75ea12dccc76062f09f164a3b0f8be4371a"
        run: |
          curl --fail --silent --show-error --location \
            --connect-timeout 10 --max-time 120 --retry 3 --retry-delay 2 --retry-all-errors \
            -o trivy.tgz \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  trivy.tgz" | sha256sum -c -
          tar xzf trivy.tgz trivy

      - name: Scan verified local image
        run: |
          # No application image has been published to GHCR at this point.
          timeout --foreground 12m ./trivy image --no-progress --severity HIGH,CRITICAL --ignore-unfixed \
            --exit-code 1 "$LOCAL_IMAGE"

      # Registry credentials are deliberately materialized only after build,
      # boot/readiness verification, and the image vulnerability/secret scan.
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish verified immutable SHA tag
        run: |
          docker tag "$LOCAL_IMAGE" "$SHA_IMAGE"
          timeout --foreground 10m docker push "$SHA_IMAGE"

      - name: Promote the same verified image to latest
        run: |
          docker tag "$LOCAL_IMAGE" "$LATEST_IMAGE"
          timeout --foreground 10m docker push "$LATEST_IMAGE"
