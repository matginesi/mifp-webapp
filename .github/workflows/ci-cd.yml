name: CI/CD

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Default workflow token is read-only. Only the GHCR publish job opts into
# packages:write.
permissions:
  contents: read

# Third-party actions are pinned to full commit SHAs (tag in the comment) so a
# moved tag or an upstream account takeover cannot run different code in a job
# that holds packages:write. .github/dependabot.yml keeps the pins current.
jobs:
  hygiene:
    name: Reject runtime/generated repository data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Check tracked source hygiene
        run: python tools/check_repo_hygiene.py
      - name: Check the production Compose exposure contract
        run: |
          # Docker publishes ports through its own iptables rules, so a UFW rule
          # would not help: every published port must be loopback-bound.
          python - <<'PY'
          import re
          import sys
          from pathlib import Path

          text = Path("deploy/compose.production.yaml").read_text(encoding="utf-8")
          published = re.findall(r"^\s*-\s*\"([^\"]+)\"\s*$", text, re.M)
          offenders = [
              entry for entry in published
              if not re.fullmatch(r"127\.0\.0\.1:\d+:\d+", entry)
          ]
          if offenders:
              print("Non-loopback published port(s): " + ", ".join(offenders), file=sys.stderr)
              raise SystemExit(1)
          if not any(entry.startswith("127.0.0.1:") for entry in published):
              print("No loopback published port found; refusing to pass silently", file=sys.stderr)
              raise SystemExit(1)
          print(f"Compose exposure contract OK ({len(published)} loopback port mapping).")
          PY

  secrets:
    name: Scan tracked files and Git history for secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Install pinned gitleaks with checksum verification
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          # A missing/corrupt download fails this step, which is visibly distinct
          # from the scan step below reporting actual leaks.
          curl -sSfL -o gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar xzf gitleaks.tgz gitleaks
      - name: Scan the full Git history
        run: ./gitleaks git . --no-banner --redact --config .gitleaks.toml
      - name: Scan the checked-out tree
        run: ./gitleaks dir . --no-banner --redact --config .gitleaks.toml

  test:
    name: Test runtime + data pipeline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Install tested dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r MIFPAPP/CORE/requirements.lock
          python -m pip install -r SCRAPERS/requirements.txt -r MIFPAPP/DATABASE/requirements.txt pytest
      - name: Run non-browser repository tests
        env:
          MIFP_TEST_AUTO_INSTALL: "0"
        run: bash test_all.sh --suite quick

  audit:
    name: Audit Python dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Install pinned audit tool
        run: python -m pip install --disable-pip-version-check "pip-audit==2.10.1"
      - name: Audit runtime dependencies
        run: python -m pip_audit -r MIFPAPP/CORE/requirements.lock
      - name: Audit scraper dependencies
        run: python -m pip_audit -r SCRAPERS/requirements.txt
      - name: Audit database pipeline dependencies
        run: python -m pip_audit -r MIFPAPP/DATABASE/requirements.txt

  build-pr:
    name: Build Docker image (pull requests only)
    needs: [hygiene, test, audit, secrets]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build without publishing
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: MIFPAPP/CORE
          push: false
          cache-from: type=gha,scope=mifp
          cache-to: type=gha,mode=max,scope=mifp

  build:
    name: Build and publish GHCR image
    needs: [hygiene, test, audit, secrets]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build-image.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        id: build-image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: MIFPAPP/CORE
          push: true
          tags: ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=mifp
          cache-to: type=gha,mode=max,scope=mifp

  verify-image:
    name: Verify published production image
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull immutable image
        env:
          IMAGE: ghcr.io/${{ github.repository }}@${{ needs.build.outputs.digest }}
        run: docker pull "$IMAGE"
      - name: Provision schema-only test database
        env:
          IMAGE: ghcr.io/${{ github.repository }}@${{ needs.build.outputs.digest }}
        run: |
          docker volume create mifp-image-verify-data
          docker run --rm --network none --entrypoint python \
            --volume mifp-image-verify-data:/app/data \
            "$IMAGE" -m mifp_app.db.manage init /app/data/mifp.db
      - name: Start image and verify health endpoints
        env:
          IMAGE: ghcr.io/${{ github.repository }}@${{ needs.build.outputs.digest }}
        run: |
          docker run --detach --name mifp-image-verify \
            --read-only \
            --tmpfs /tmp:size=64m,mode=1777,noexec,nosuid,nodev \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --pids-limit 256 \
            --publish 127.0.0.1::8000 \
            --volume mifp-image-verify-data:/app/data \
            --env MIFP_LOAD_DOTENV=0 \
            --env FLASK_ENV=production \
            --env FLASK_DEBUG=0 \
            --env SECRET_KEY=ci-image-verification-secret-key-00000000000000000000000000000000 \
            --env ADMIN_USERNAME=ci-admin \
            --env ADMIN_PASSWORD_HASH=ci-verification-placeholder \
            --env TRUSTED_HOSTS=127.0.0.1,localhost \
            --env DATABASE_PATH=/app/data/mifp.db \
            --env ASSETS_DIR=/app/data/assets \
            --env EXPORT_DIR=/app/data/exports \
            --env LOG_DIR=/app/data/logs \
            --env CONFERENCES_DIR=/app/data/conferences \
            --env BANNER_SETTINGS_PATH=/app/data/config/banner_settings.json \
            --env TMPDIR=/app/data/tmp \
            --env STORAGE_MIN_FREE_MB=0 \
            --env LOG_OUTPUT=stdout \
            --env GUNICORN_BIND=0.0.0.0:8000 \
            "$IMAGE"

          port="$(docker port mifp-image-verify 8000/tcp | sed -n 's/.*://p' | head -n 1)"
          test -n "$port"
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error --max-time 3 "http://127.0.0.1:${port}/ready" >/dev/null; then
              curl --fail --silent --show-error --max-time 3 "http://127.0.0.1:${port}/health" >/dev/null
              exit 0
            fi
            if test "$(docker inspect --format '{{.State.Running}}' mifp-image-verify)" != "true"; then
              docker logs mifp-image-verify
              exit 1
            fi
            sleep 2
          done
          docker logs mifp-image-verify
          exit 1
      - name: Clean up verification container
        if: always()
        run: |
          docker rm --force mifp-image-verify 2>/dev/null || true
          docker volume rm --force mifp-image-verify-data 2>/dev/null || true

  image-scan:
    name: Scan production image for fixable HIGH/CRITICAL CVEs
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Install pinned Trivy with checksum verification
        env:
          TRIVY_VERSION: "0.74.0"
          TRIVY_SHA256: "2ae6fe3ee734b7fdf11335663e18c75ea12dccc76062f09f164a3b0f8be4371a"
        run: |
          # Infrastructure failure (download/checksum) fails this step, which is
          # distinguishable in the UI from the scan step reporting findings.
          curl -sSfL -o trivy.tgz \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  trivy.tgz" | sha256sum -c -
          tar xzf trivy.tgz trivy
      - name: Scan the immutable image by digest
        env:
          IMAGE: ghcr.io/${{ github.repository }}@${{ needs.build.outputs.digest }}
        run: |
          # `--ignore-unfixed` keeps the gate actionable: Debian base packages
          # with no available patch would otherwise fail every run forever.
          # Unfixed findings are reviewed in docs/audit, not silenced silently.
          docker pull "$IMAGE"
          ./trivy image --no-progress --severity HIGH,CRITICAL --ignore-unfixed \
            --exit-code 1 "$IMAGE"

  promote-latest:
    name: Promote verified image to latest
    needs: [build, verify-image, image-scan]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Point latest at the verified digest
        env:
          REPOSITORY: ghcr.io/${{ github.repository }}
          DIGEST: ${{ needs.build.outputs.digest }}
        run: docker buildx imagetools create --tag "$REPOSITORY:latest" "$REPOSITORY@$DIGEST"
