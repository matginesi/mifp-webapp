name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  webapp-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            MIFPAPP/CORE/requirements.txt
            MIFPAPP/CORE/requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            -r MIFPAPP/CORE/requirements.txt \
            -r MIFPAPP/CORE/requirements-dev.txt
      - name: Compile Python
        run: python -m compileall -q MIFPAPP/CORE
      - name: Run webapp tests
        env:
          MIFP_LOAD_DOTENV: "0"
          PYTHONPATH: MIFPAPP/CORE
        run: python -m pytest TESTS/webapp -ra --tb=short

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build runtime image
        uses: docker/build-push-action@v7
        with:
          context: MIFPAPP/CORE
          target: runtime
          push: false
