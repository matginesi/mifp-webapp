name: Prune GHCR image versions

# Every CI run publishes an immutable sha-<commit> image. Keep a bounded history
# without depending on a third-party JavaScript cleanup action/runtime.
# The repository-owned Python tool always protects `latest`, keeps the newest N
# versions, caps API pagination/deletions, and has bounded HTTP retries/timeouts.

on:
  workflow_dispatch:
    inputs:
      min_versions_to_keep:
        description: "Most-recent image versions to keep (minimum 5)"
        required: false
        default: "30"
  schedule:
    - cron: "23 3 * * 0"

permissions:
  contents: read
  packages: write

concurrency:
  group: ghcr-cleanup-${{ github.repository }}
  cancel-in-progress: true

jobs:
  prune:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Validate retention window
        env:
          MIN_TO_KEEP: ${{ github.event.inputs.min_versions_to_keep || '30' }}
        run: |
          case "$MIN_TO_KEEP" in
            ''|*[!0-9]*)
              echo "min_versions_to_keep must be a non-negative integer" >&2
              exit 1
              ;;
          esac
          if [ "$MIN_TO_KEEP" -lt 5 ]; then
            echo "Refusing to keep fewer than 5 image versions." >&2
            exit 1
          fi

      - name: Delete old container image versions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MIN_TO_KEEP: ${{ github.event.inputs.min_versions_to_keep || '30' }}
        run: |
          PACKAGE_NAME="${GITHUB_REPOSITORY#*/}"
          timeout --foreground 10m python3 tools/prune_ghcr_versions.py \
            --repository "$GITHUB_REPOSITORY" \
            --package-name "$PACKAGE_NAME" \
            --min-versions-to-keep "$MIN_TO_KEEP" \
            --max-deletions 100
