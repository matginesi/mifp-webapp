version: 2

# Keep dependency maintenance reviewable instead of opening one PR/branch per
# package. Routine updates are grouped by ecosystem; security updates are also
# grouped so a vulnerability wave does not create branch spam.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      github-actions-version-updates:
        applies-to: version-updates
        patterns:
          - "*"
      github-actions-security-updates:
        applies-to: security-updates
        patterns:
          - "*"

  # Base-image digest/package drift for the production image.
  - package-ecosystem: docker
    directory: /MIFPAPP/CORE
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      production-image-version-updates:
        applies-to: version-updates
        patterns:
          - "*"
      production-image-security-updates:
        applies-to: security-updates
        patterns:
          - "*"

  # One Python Dependabot entry for the monorepo instead of one entry (and one
  # queue of PRs) per directory. `patterns: "*"` combines routine updates into
  # a single Python PR. Security updates are kept separate from routine updates
  # but grouped with each other.
  - package-ecosystem: pip
    directories:
      - /MIFPAPP/CORE
      - /MIFPAPP/DATABASE
      - /SCRAPERS
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      python-version-updates:
        applies-to: version-updates
        patterns:
          - "*"
      python-security-updates:
        applies-to: security-updates
        patterns:
          - "*"
