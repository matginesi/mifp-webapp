# Optional, selected by mifpctl only after REGISTRATIONS_DASHBOARD_ENABLED=true.
# No sessions, credentials or host socket are exposed. Writes require explicit opt-in.
services:
  web:
    environment:
      REGISTRATIONS_PRIVATE_ROOT: /run/mifp-registrations
      REGISTRATIONS_WRITE_ENABLED: "${MIFP_REGISTRATIONS_WRITE_ENABLED:-false}"
    group_add:
      - "${MIFP_REGISTRATIONS_GID:?host PHP group required}"
    volumes:
      - type: bind
        source: "${MIFP_REGISTRATIONS_PRIVATE_DIR:?private registration root required}/registrations"
        target: /run/mifp-registrations/registrations
        read_only: ${MIFP_REGISTRATIONS_READ_ONLY:-true}
        bind:
          create_host_path: false
      - type: bind
        source: "${MIFP_REGISTRATIONS_PRIVATE_DIR:?private registration root required}/uploads"
        target: /run/mifp-registrations/uploads
        read_only: ${MIFP_REGISTRATIONS_READ_ONLY:-true}
        bind:
          create_host_path: false
