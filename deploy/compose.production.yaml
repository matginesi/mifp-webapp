# Production Docker Compose. The image is selected explicitly by deploy.sh;
# production never builds application code on the VPS.
#
# The project name must stay `mifp`: deploy.sh passes --project-name mifp and
# backup.sh quiesces containers by the `com.docker.compose.project=mifp` label,
# so an out-of-band `docker compose up` with a different name would silently
# skip the point-in-time pause.
name: mifp

services:
  web:
    image: "${MIFP_IMAGE:?MIFP_IMAGE must be supplied by deploy.sh}"
    env_file:
      - path: .env
        required: false
    environment:
      MIFP_LOAD_DOTENV: "0"
      # Application secrets are mounted as Docker secrets, not exposed through
      # the container environment or baked into the image. Empty legacy values
      # in .env intentionally fall through to these *_FILE paths.
      SECRET_KEY_FILE: /run/secrets/mifp_secret_key
      ADMIN_PASSWORD_HASH_FILE: /run/secrets/mifp_admin_password_hash
      SMTP_PASSWORD_FILE: /run/secrets/mifp_smtp_password
      EVENTS_REMOTE_PASSWORD_FILE: /run/secrets/mifp_events_remote_password
      # Read-only release identity for the dashboard. The host remains the only
      # component allowed to deploy/update/rollback images.
      MIFP_RELEASE_REF: "${MIFP_IMAGE}"
      MIFP_RELEASE_CHANNEL: "${MIFP_IMAGE_REPOSITORY:-ghcr.io/matginesi/mifp-webapp}:latest"
      FLASK_ENV: production
      FLASK_DEBUG: "0"
      SESSION_COOKIE_SECURE: "1"
      SESSION_COOKIE_SAMESITE: Lax
      CSRF_ENABLED: "1"
      # The only published application socket is host-loopback and Caddy is the
      # single reverse proxy in front of it, so exactly one forwarded hop is
      # trusted for client IP and HTTPS scheme normalization.
      TRUST_PROXY: "1"
      PROXY_FIX_X_FOR: "1"
      PROXY_FIX_X_PROTO: "1"
      PROXY_FIX_X_HOST: "0"
      TRUSTED_HOSTS: "${TRUSTED_HOSTS:-mifp.eu,www.mifp.eu,127.0.0.1,localhost}"
      ALLOW_DB_DUMP: "0"
      ALLOW_DB_RESTORE: "0"
      # Backup credentials are host-only and are never mounted into this service.
      RESTIC_PASSWORD: ""
      DATABASE_PATH: /app/data/mifp.db
      ASSETS_DIR: /app/data/assets
      EXPORT_DIR: /app/data/exports
      TMPDIR: /app/data/tmp
      LOG_DIR: /app/data/logs
      CONFERENCES_DIR: /app/data/conferences
      # Phase 1 publishes event mini-sites to a dedicated host directory. The
      # source ZIPs remain private below CONFERENCES_DIR.
      EVENTS_PUBLISH_BACKEND: "${EVENTS_PUBLISH_BACKEND:-local-vps}"
      EVENTS_PUBLIC_BASE_URL: "${EVENTS_PUBLIC_BASE_URL:-https://events.mifp.eu}"
      EVENTS_LOCAL_ROOT: /app/event-sites
      EVENTS_REMOTE_PROTOCOL: "${EVENTS_REMOTE_PROTOCOL:-ftps}"
      EVENTS_REMOTE_HOST: "${EVENTS_REMOTE_HOST:-}"
      EVENTS_REMOTE_PORT: "${EVENTS_REMOTE_PORT:-21}"
      EVENTS_REMOTE_USER: "${EVENTS_REMOTE_USER:-}"
      EVENTS_REMOTE_ROOT: "${EVENTS_REMOTE_ROOT:-}"
      EVENTS_REMOTE_TIMEOUT: "${EVENTS_REMOTE_TIMEOUT:-30}"
      RUNTIME_CONFIG_DIR: /app/data/config
      STORAGE_MIN_FREE_MB: "${STORAGE_MIN_FREE_MB:-1024}"
      LOG_OUTPUT: stdout
      # Files are the durable diagnostic record (JSONL); the console is what a
      # human reads in `docker logs` (compact text). Both fall back to
      # LOG_FORMAT, so a deployment that sets only that one is unchanged.
      LOG_FORMAT: "${LOG_FORMAT:-json}"
      LOG_FILE_FORMAT: "${LOG_FILE_FORMAT:-json}"
      LOG_CONSOLE_FORMAT: "${LOG_CONSOLE_FORMAT:-text}"
      # Listen on the container interface; exposure is restricted by the host
      # publish rule below to 127.0.0.1 only.
      GUNICORN_BIND: 0.0.0.0:8000
      GUNICORN_WORKERS: "${GUNICORN_WORKERS:-1}"
      GUNICORN_THREADS: "${GUNICORN_THREADS:-4}"
      BACKGROUND_JOB_WORKERS: "${BACKGROUND_JOB_WORKERS:-1}"
    ports:
      - "127.0.0.1:8000:8000"
    secrets:
      - mifp_secret_key
      - mifp_admin_password_hash
      - mifp_smtp_password
      - mifp_events_remote_password
    volumes:
      - "${MIFP_DATA_DIR:-/opt/mifp/data}:/app/data"
      # Dedicated publication-only tree. It is outside normal application data
      # and is served directly by host Caddy only in local-vps mode.
      - "${EVENTS_LOCAL_ROOT:-/srv/mifp-events}:/app/event-sites"
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=${MIFP_TMP_SIZE:-256m},mode=1777,noexec,nosuid,nodev
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    mem_limit: ${MIFP_MEMORY_LIMIT:-1536m}
    cpus: ${MIFP_CPU_LIMIT:-2.0}
    stop_signal: SIGTERM
    stop_grace_period: 35s
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 8
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

secrets:
  # File-backed sources are required with a read-only service rootfs.
  # /etc/mifp/secrets.env remains canonical; mifpctl materializes these
  # root-only derived files before any Compose operation.
  mifp_secret_key:
    file: "${MIFP_SECRETS_DIR:-/etc/mifp/secrets}/mifp_secret_key"
  mifp_admin_password_hash:
    file: "${MIFP_SECRETS_DIR:-/etc/mifp/secrets}/mifp_admin_password_hash"
  mifp_smtp_password:
    file: "${MIFP_SECRETS_DIR:-/etc/mifp/secrets}/mifp_smtp_password"
  mifp_events_remote_password:
    file: "${MIFP_SECRETS_DIR:-/etc/mifp/secrets}/mifp_events_remote_password"
