# MIFP Polls — Winter School 2027
# Import this template as a NEW DRAFT in MIFP Polls.
# Complete the pending legal fields and deadline/retention dates in Privacy
# details, then review the complete participant notice before publishing.
# The YAML must NOT imply that the privacy notice was legally approved.

schema_version: 1

poll:
  title: "MIFP Winter School 2027 — Interest and Availability"
  description: >-
    MIFP is preparing the Winter School on Artificial Intelligence for
    Science and Technology, scheduled for 21–28 February 2027 in
    Tsaghkadzor, Armenia.

    We would appreciate your feedback on your interest and potential
    availability. This short survey is intended solely for preliminary
    organisational planning: it is not an event registration, a booking,
    or a commitment to participate.

    Please answer only once. The survey does not ask for your name or
    email address.

  response_mode: "anonymous"

  # To be agreed by the organisers. Format: YYYY-MM-DD.
  # Use a retention date AFTER the survey deadline.
  deadline: null
  retention_until: null

  questions:
    - type: "single_choice"
      question: "Would you be interested in attending the MIFP Winter School 2027?"
      required: true
      options:
        - "Yes, I am interested"
        - "Maybe, depending on the programme and practical arrangements"
        - "No, I am not interested"

    - type: "date_availability"
      question: "On which days could you potentially attend?"
      required: false
      dates:
        - "2027-02-21"
        - "2027-02-22"
        - "2027-02-23"
        - "2027-02-24"
        - "2027-02-25"
        - "2027-02-26"
        - "2027-02-27"
        - "2027-02-28"
      # For each date: Yes / Maybe / No / no answer.
      # No answer must NOT be interpreted as No.

  # Identity/address/contact supplied by the administrator from MIFP's policy.
  # Import is a Draft, never legal approval. Blank fields must be completed
  # before publication. Hosting in Italy does not prove absence of transfers.
  privacy:
    controller: >-
      Mediterranean Institute of Fundamental Physics (MIFP),
      Via Appia Nuova 31, 00047 Marino (Roma), Italy
    contact: "secretary@mifp.eu"
    purpose: >-
      Preliminary collection of interest and availability for the
      MIFP Winter School 2027.
    # Specific legal basis for Polls: not yet confirmed by the administrator.
    legal_basis: ""
    # Required if legitimate_interest is selected; not yet confirmed.
    legitimate_interest: ""
    # Proposed recipients/processors only: confirm actual access/providers.
    recipients: >-
      Access reserved to authorised MIFP administrators; technical processing
      by applicable hosting and backup providers. Draft description to be
      confirmed before publication.
    # Assess actual remote access, processors and backups; do not assume None.
    transfers: ""
    # Optional, if appointed; no DPO appointment has been confirmed here.
    dpo: ""
    additional_disclosures: >-
      Invitations are distributed externally through Aruba mailing lists.
      The shared survey URL does not authenticate respondents as MIFP members.
