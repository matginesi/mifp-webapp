services:
  web:
    environment:
      SESSION_COOKIE_SECURE: "1"
      TRUST_PROXY: "1"
      TRUSTED_HOSTS: "${MIFP_DOMAIN},www.${MIFP_DOMAIN},localhost,127.0.0.1"

  caddy:
    image: caddy:2-alpine
    depends_on:
      web:
        condition: service_healthy
    environment:
      MIFP_DOMAIN: "${MIFP_DOMAIN}"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

volumes:
  caddy-data:
  caddy-config:
