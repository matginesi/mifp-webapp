privacy:
  enabled: true
  show_banner: true
  storage_key: mifp-conference-privacy
  banner_text: 'This site does not use analytics, advertising or marketing cookies. The registration form uses only a strictly necessary security session cookie. This notice is informational: no optional-cookie consent is requested. Closing it stores only a local browser preference.'
  page_label: 'Legal & privacy'
  page_title: 'Privacy & Cookies'
  intro: This reusable privacy page must be reviewed for NEW-CONFERENCE before publication.
  sections:
    - title: Data Controller
      paragraphs:
        - MIFP – Mediterranean Institute of Fundamental Physics
        - TBC
        - Privacy contact — TBC
    - title: Information processed
      paragraphs:
        - 'Browsing the public conference pages does not require an account and the site does not include advertising, analytics or profiling scripts.'
        - 'If you use the registration form, MIFP processes the information you submit, which may include your name, contact details, affiliation, country, travel or attendance information, registration category, dietary information when provided, and proof of payment. The web server may also create ordinary technical and security logs.'
        - Please provide only information that is necessary for participation. Dietary or accessibility notes should be limited to what the organisers need to arrange the event.
    - title: Purposes and legal bases
      paragraphs:
        - 'Registration data is used to process your participation, verify registration and payment information, communicate with you about NEW-CONFERENCE, organise event logistics, prepare participant materials or certificates, and meet applicable administrative, accounting or legal obligations.'
        - 'Depending on the processing activity, the legal basis is the performance of a contract or steps requested before entering into a contract, compliance with legal obligations, and the legitimate interests of the organisers in operating and securing the event. Where a specific activity requires consent, that consent will be requested separately.'
    - title: 'Cookies & local storage'
      paragraphs:
        - 'The public conference pages do not set analytics, advertising, profiling or marketing cookies, and no third-party tracking pixels are loaded.'
        - 'The PHP registration form uses a strictly necessary session cookie only to maintain the secure form session and CSRF protection. It is not used for advertising or profiling. The cookie is configured with HttpOnly and SameSite=Strict; Secure is enabled when the site is served over HTTPS.'
        - 'Because the site does not set optional analytics or marketing cookies, there is no Accept/Reject consent banner for optional cookies. The privacy notice is informational rather than a request for tracking consent.'
        - 'Dismissing the privacy notice stores a local browser preference. When interface preferences are enabled, localStorage may also remember the selected theme or palette. These browser-only preferences are not used to identify you or track you across websites. You can remove them at any time by clearing this site’s browser data.'
    - title: Recipients and service providers
      paragraphs:
        - 'Registration information is accessible only to the organisers and, where necessary for registration or payment administration, ER GLOBAL COMMUNICATION SRL and service providers involved in hosting, email delivery, venue, catering or event logistics. Data is shared only to the extent necessary for those purposes.'
        - 'External services reached through links, such as payment providers, travel services, Google Maps or other third-party websites, operate under their own privacy and cookie policies. Google Maps is not embedded by this template; directions open only after an explicit click.'
    - title: Retention and security
      paragraphs:
        - 'Personal data is kept only for as long as necessary to administer the conference and for any applicable accounting, legal or record-keeping requirements. Payment or accounting records may need to be retained for longer where required by law.'
        - 'The registration form uses CSRF protection, secure session-cookie settings, validation, rate limiting and restricted upload handling. No internet service can guarantee absolute security, so unnecessary sensitive information should not be submitted.'
    - title: Your rights
      paragraphs:
        - 'Where the GDPR applies, you may request access, rectification, erasure, restriction or portability of your personal data, and you may object to processing based on legitimate interests. Where processing is based on consent, you may withdraw that consent without affecting earlier lawful processing.'
        - 'Requests can be sent to TBC. You also have the right to lodge a complaint with the competent data-protection authority, including the Italian Garante per la protezione dei dati personali where applicable.'
    - title: Contact
      paragraphs:
        - Privacy questions and data-subject requests — TBC
