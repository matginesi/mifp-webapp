[project]
name = "mifp-webapp"
version = "0.0.1"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.1.3,<4",
    "werkzeug>=3.1.8,<4",
    "gunicorn>=23.0,<24",
    "openpyxl>=3.1.5,<4",
    "python-docx>=1.2.0,<2",
    "python-dotenv>=1.1.1,<2",
    "reportlab>=4.5.1,<5",
    "pyyaml>=6.0.3,<7",
    "markdown>=3.10.2,<4",
    "bleach>=6.3.0,<7",
    "weasyprint>=68.1,<70",
]

[project.scripts]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "RUF", # ruff-specific rules
]
ignore = [
    "BLE001", # blind-except - intentionally used for robustness
    "DTZ",    # datetime-timezone - intentionally using naive datetimes for SQLite REAL
    "TRY004", # type-check-without-type-error
    "TRY300", # try-except-raise
    "S110",   # try-except-pass
    "EXE002", # shebang-missing-executable-file
    "S110",   # try-except-pass
]

[tool.ruff.lint.per-file-ignores]
"mifp_app/__init__.py" = ["B023"]  # loop-variable-shadowing

[tool.mypy]
python_version = "3.12"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "python_docx.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "reportlab.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "weasyprint.*"
ignore_missing_imports = true
