<div class="modal fade" id="sendAuthModal" tabindex="-1" aria-labelledby="sendAuthTitle" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <form class="modal-content smart-modal export-auth-modal" id="sendAuthForm" data-no-spinner="1">
      <div class="modal-header">
        <h5 class="modal-title" id="sendAuthTitle"><i class="bi bi-shield-lock"></i> Confirm email delivery</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <div class="export-auth-notice"><i class="bi bi-envelope" aria-hidden="true"></i><div><b>Authorize a real send</b><span>Enter the administrator password to send the selected email or invitations.</span></div></div>
        <label class="form-label" for="sendAuthPassword">Administrator password</label>
        <input class="form-control" id="sendAuthPassword" type="password" autocomplete="current-password" required>
        <small class="export-auth-security">The server verifies the password. It is never saved or included in delivery logs.</small>
      </div>
      <div class="modal-footer"><button type="button" class="btn btn-outline" data-bs-dismiss="modal">Cancel</button><button type="submit" class="btn btn-primary">Verify and send</button></div>
    </form>
  </div>
</div>
