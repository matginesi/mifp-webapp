<div class="modal fade" id="assetPickerModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-lg modal-dialog-scrollable">
    <div class="modal-content smart-modal">
      <div class="modal-header">
        <h5 class="modal-title">Select asset</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close asset picker"></button>
      </div>
      <div class="modal-body">
        <div class="asset-picker-tabs" role="tablist" aria-label="Asset source">
          <button class="asset-tab is-active" id="asset-tab-control-existing" type="button" role="tab" aria-selected="true" aria-controls="asset-tab-existing" data-asset-tab="existing">Existing</button>
          <button class="asset-tab" id="asset-tab-control-upload" type="button" role="tab" aria-selected="false" aria-controls="asset-tab-upload" tabindex="-1" data-asset-tab="upload">Upload</button>
          <button class="asset-tab" id="asset-tab-control-url" type="button" role="tab" aria-selected="false" aria-controls="asset-tab-url" tabindex="-1" data-asset-tab="url">URL</button>
        </div>
        <div class="asset-tab-panel is-active" id="asset-tab-existing" role="tabpanel" aria-labelledby="asset-tab-control-existing">
          <div class="asset-picker-search">
            <input type="search" class="form-control form-control-sm" id="assetPickerQuery" placeholder="Search by filename or caption…" autocomplete="off" aria-label="Search assets">
            <select class="form-select form-select-sm" id="assetPickerKind" aria-label="Filter assets by kind">
              <option value="">All kinds</option>
              <option value="image">Image</option>
              <option value="document">Document</option>
              <option value="pdf">PDF</option>
              <option value="video">Video</option>
              <option value="other">Other</option>
            </select>
            <button class="btn btn-primary btn-sm" id="assetPickerSearchBtn"><i class="bi bi-search"></i> Search</button>
          </div>
          <div class="asset-picker-grid" id="assetPickerResults">
            <div class="asset-picker-empty">Loading assets…</div>
          </div>
        </div>
        <div class="asset-tab-panel" id="asset-tab-upload" role="tabpanel" aria-labelledby="asset-tab-control-upload" hidden>
          <form id="assetPickerUploadForm" class="picker-create-form" enctype="multipart/form-data">
            <input type="hidden" name="_csrf_token" value="{{ csrf_token }}">
            <input type="file" name="file" class="form-control form-control-sm" required aria-label="Asset file">
            <select name="kind" class="form-select form-select-sm" aria-label="Asset kind">
              <option value="">Auto kind</option><option value="image">Image</option><option value="pdf">PDF</option><option value="document">Document</option><option value="video">Video</option><option value="other">Other</option>
            </select>
            <input name="alt_text" class="form-control form-control-sm" placeholder="Alt text…" aria-label="Alternative text">
            <input name="caption" class="form-control form-control-sm" placeholder="Caption…" aria-label="Caption">
            <button class="btn btn-primary btn-sm" type="submit"><i class="bi bi-upload"></i> Upload and select</button>
          </form>
        </div>
        <div class="asset-tab-panel" id="asset-tab-url" role="tabpanel" aria-labelledby="asset-tab-control-url" hidden>
          <form id="assetPickerUrlForm" class="picker-create-form">
            <input type="hidden" name="_csrf_token" value="{{ csrf_token }}">
            <input name="source_url" type="url" class="form-control form-control-sm" placeholder="https://…" required aria-label="External asset URL">
            <select name="kind" class="form-select form-select-sm" aria-label="External asset kind">
              <option value="other">Other</option><option value="image">Image</option><option value="pdf">PDF</option><option value="document">Document</option><option value="video">Video</option>
            </select>
            <input name="alt_text" class="form-control form-control-sm" placeholder="Alt text…" aria-label="Alternative text">
            <input name="caption" class="form-control form-control-sm" placeholder="Caption…" aria-label="Caption">
            <button class="btn btn-primary btn-sm" type="submit"><i class="bi bi-link-45deg"></i> Register and select</button>
          </form>
        </div>
      </div>
      <div class="modal-footer">
        <span class="tiny muted" id="assetPickerStatus" aria-live="polite"></span>
        <button type="button" class="btn btn-outline btn-sm" data-bs-dismiss="modal">Cancel</button>
      </div>
    </div>
  </div>
</div>

<div class="modal fade" id="externalLinkModal" tabindex="-1" aria-labelledby="externalLinkTitle" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content smart-modal">
      <div class="modal-header">
        <h5 class="modal-title" id="externalLinkTitle"><i class="bi bi-link-45deg"></i> Add external link</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <form id="externalLinkForm" class="modal-body link-editor-form" novalidate>
        <label class="field">
          <span>URL</span>
          <input type="url" name="url" class="form-control form-control-sm" required aria-label="External link URL" placeholder="https://…">
        </label>
        <label class="field">
          <span>Role</span>
          <input type="text" name="role" class="form-control form-control-sm" value="primary" list="externalLinkRoles" aria-label="Link role">
          <datalist id="externalLinkRoles">
            <option value="primary"></option>
            <option value="website"></option>
            <option value="source"></option>
            <option value="doi"></option>
            <option value="publisher"></option>
            <option value="registration"></option>
            <option value="program"></option>
            <option value="document"></option>
            <option value="social"></option>
            <option value="other"></option>
          </datalist>
        </label>
        <label class="field">
          <span>Label (optional)</span>
          <input type="text" name="label" class="form-control form-control-sm" aria-label="Link label">
        </label>
      </form>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline btn-sm" data-bs-dismiss="modal">Cancel</button>
        <button type="submit" class="btn btn-primary btn-sm" form="externalLinkForm"><i class="bi bi-check-lg"></i> Add link</button>
      </div>
    </div>
  </div>
</div>
