<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ code }} &middot; MIFP</title>
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='img/logo-mifp.png', v=static_version) }}">
  <link href="{{ url_for('static', filename='css/homepage.css', v=static_version) }}" rel="stylesheet">
</head>
<body class="public-site error-page">
  <main class="error-card" id="main-content">
    <div class="error-code">{{ code }}</div>
    <h1>{{ title }}</h1>
    <p>{{ message }}</p>
    <a class="btn btn-primary" href="{{ url_for('public.home') }}">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      Back to home
    </a>
    {% if request_id and request_id != "-" %}
    <p class="error-request-id">Request ID: {{ request_id }}</p>
    {% endif %}
  </main>
</body>
</html>
