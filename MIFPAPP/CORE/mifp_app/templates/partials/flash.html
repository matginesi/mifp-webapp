{% with messages = get_flashed_messages(with_categories=true) %}
  {% if messages %}
    <div class="flash-stack" aria-live="polite" aria-atomic="true">
    {% for category, message in messages %}
      <div class="alert alert-{{ category }} py-2 px-3 small mb-2" role="{{ 'alert' if category in ['error', 'danger'] else 'status' }}">{{ message }}</div>
    {% endfor %}
    </div>
  {% endif %}
{% endwith %}
