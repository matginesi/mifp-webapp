  city_paragraphs:
    - 'The city has developed through Roman, Byzantine, Bulgarian, Hungarian, Serbian, Ottoman and Habsburg periods. The Roman settlement of Singidunum occupied the area of present-day Belgrade, while the modern city became the capital of Serbia in the nineteenth century and later of Yugoslavia.'
