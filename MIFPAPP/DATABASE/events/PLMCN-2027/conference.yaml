home_intro:
  enabled: true
  label: The Conference
  title: The International Conference on Physics of Light-Matter Coupling in Nanostructures and Nanophotonics (PLMCN-2027)
  paragraphs:
    - 'The International Conference on Physics of Light-Matter Coupling in Nanostructures and Nanophotonics (PLMCN-2027) will be held in Belgrade, Serbia, from 7 to 10 April 2027.'
    - 'The PLMCN-2027 conference will be devoted to the fundamental and technological issues relevant to the realization of a new generation of opto-electronic devices based on advanced low-dimensional and photonic structures, such as low threshold polariton lasers, new optical switches, single photon emitters, photonic band-gap structures, etc. '
    - 'It should review recent achievements in the fundamental understanding of strong light-matter coupling, as well as follow progress in the development of epitaxial and processing technologies of wide gap semiconductor and organic nanostructures and microcavities providing the basis for advanced optical studies, as well as metamaterials, photonics, quantum and neuromorphic computation, spintronics, superconductivity and related topics.'
    - PLMCN remains open to emerging fields including carbon nanostructures and quantum information. The 2027 edition will also include a dedicated Quantum Optics School as a tutorial-oriented component of the scientific programme.
  links:
    - label: MIFP — Website
      href: 'https://mifp.eu'
      external: true
quantum_school:
  enabled: true
  label: Quantum Optics School
  title: Quantum Optics School
  subtitle: Two days to prepare for PLMCN-2027
  paragraphs:
    - 'The **PLMCN-2027 Quantum Optics School** is a two-day tutorial programme designed primarily for students and early-career researchers attending the conference.'
    - 'Its purpose is to provide the conceptual background needed to follow and appreciate the scientific programme of PLMCN-2027 more effectively. Rather than being a separate event, the School is conceived as an **introduction to the conference itself**, building a bridge between the foundations of quantum optics and the topics that will be discussed in greater depth during the following days.'
    - 'Through a series of pedagogical lectures, the School will review key ideas in quantum light, measurement, light–matter interaction, optical cavities, quantum emitters, excitons and polaritons, nanophotonics and quantum information. Particular attention will be given to the physical concepts and terminology that connect these subjects to the main research themes of PLMCN.'
    - 'The aim is not to provide an exhaustive course in quantum optics, but to give participants a **common scientific foundation and a clearer framework for understanding the conference lectures, discussions and emerging research directions**.'
  image: assets/venue/majestic_05.jpeg
  image_caption: Hotel Majestic · meeting room for PLMCN-2027 activities
  topics:
    - title: 'Quantum light & measurement'
      text: 'An introduction to quantum states of light, basic measurement concepts, coherence, correlations and the experimentally relevant foundations of quantum optics.'
    - title: Light–matter interaction
      text: 'A tutorial overview of the fundamental models of light–matter coupling, from weak to strong coupling, with emphasis on concepts relevant to nanoscale and condensed-matter photonic systems.'
    - title: 'Cavities, emitters & polaritons'
      text: 'The physics of optical cavities and quantum emitters, and their connection to excitons, hybrid light–matter states and polaritonic systems that play a central role in many areas represented at PLMCN.'
    - title: 'Quantum photonics & information'
      text: 'An introduction to the concepts linking photonic and solid-state platforms with quantum information, quantum technologies and emerging applications.'
  closing_paragraphs:
    - 'The School will take place over **two days immediately preceding the main PLMCN-2027 scientific programme**, allowing participants to enter the conference with a stronger shared background and to make the most of the lectures, presentations and scientific discussions that follow.'
  notice: '**Lecturers, detailed programme, level recommendations and participation information will be announced.**'
  gallery_enabled: true
  gallery_label: 'School & meeting spaces'
  gallery_initial: 0
  images:
